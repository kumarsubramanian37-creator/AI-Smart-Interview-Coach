<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Smart Interview Coach</title>
<style>
:root{
  --bg1:#eef2ff;--bg2:#f0f9ff;--bg3:#fdf4ff;
  --card:rgba(255,255,255,.78);--cardS:#fff;--text:#0f172a;--muted:#475569;--line:#cbd5e1;--soft:#f1f5f9;
  --ac:#4f46e5;--ac2:#2563eb;--ok:#047857;--okbg:#d1fae5;--mid:#b45309;--midbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;
  --chip:#eef2ff;--chipt:#3730a3;--shadow:0 10px 36px rgba(79,70,229,.12);--ring:#e2e8f0;--focus:#2563eb;
  --hero:linear-gradient(120deg,#4f46e5,#2563eb 55%,#0891b2);
}
:root[data-theme="dark"]{
  --bg1:#0b1120;--bg2:#0f172a;--bg3:#111a2e;
  --card:rgba(30,41,59,.82);--cardS:#1e293b;--text:#e2e8f0;--muted:#a7b4c8;--line:#3b4a63;--soft:#0f1a2e;
  --ac:#818cf8;--ac2:#60a5fa;--ok:#6ee7b7;--okbg:#064e3b;--mid:#fcd34d;--midbg:#451a03;--bad:#fca5a5;--badbg:#450a0a;
  --chip:#1e1b4b;--chipt:#c7d2fe;--shadow:0 10px 36px rgba(0,0,0,.4);--ring:#334155;--focus:#93c5fd;
  --hero:linear-gradient(120deg,#312e81,#1e3a8a 55%,#155e75);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#0b1120;--bg2:#0f172a;--bg3:#111a2e;
    --card:rgba(30,41,59,.82);--cardS:#1e293b;--text:#e2e8f0;--muted:#a7b4c8;--line:#3b4a63;--soft:#0f1a2e;
    --ac:#818cf8;--ac2:#60a5fa;--ok:#6ee7b7;--okbg:#064e3b;--mid:#fcd34d;--midbg:#451a03;--bad:#fca5a5;--badbg:#450a0a;
    --chip:#1e1b4b;--chipt:#c7d2fe;--shadow:0 10px 36px rgba(0,0,0,.4);--ring:#334155;--focus:#93c5fd;
    --hero:linear-gradient(120deg,#312e81,#1e3a8a 55%,#155e75);
  }
}
*,*:before,*:after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Tamil","Latha","Nirmala UI",sans-serif;line-height:1.55;
  background:linear-gradient(135deg,var(--bg1),var(--bg2) 50%,var(--bg3)) fixed;padding-bottom:env(safe-area-inset-bottom,0)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;cursor:pointer;color:inherit}
h1,h2,h3{margin:0}
h2{font-size:clamp(20px,4.4vw,27px)}
h3{font-size:17px;margin:18px 0 8px}
.wrap{max-width:1060px;margin:0 auto;padding:0 16px 36px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px clamp(12px,3vw,26px)}
.top b{font-size:clamp(16px,3.4vw,20px)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.hero{position:relative;overflow:hidden;color:#fff;text-align:center;padding:clamp(30px,6vw,58px) 18px 92px;background:var(--hero);border-radius:0 0 36px 36px}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;opacity:.35}
.hero:before{width:300px;height:300px;left:-80px;top:-110px;background:radial-gradient(#c4b5fd,transparent 70%)}
.hero:after{width:360px;height:360px;right:-100px;bottom:-170px;background:radial-gradient(#67e8f9,transparent 70%)}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:clamp(28px,6.4vw,52px);line-height:1.12;margin:12px 0 10px;letter-spacing:-.5px}
.hero p{max-width:600px;margin:0 auto;color:#e0e7ff;font-size:clamp(15px,3vw,18px)}
.pill{display:inline-block;padding:6px 16px;border-radius:99px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);font-weight:800;font-size:12px;letter-spacing:.14em;box-shadow:0 0 24px rgba(196,181,253,.45)}
.hero h1{text-shadow:0 4px 30px rgba(15,23,42,.25)}
.hero p.tag{font-weight:800;color:#fff;font-size:clamp(17px,3.4vw,22px);margin-bottom:6px}
.pull{margin-top:-46px;position:relative;z-index:2}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:clamp(15px,3vw,26px);margin-bottom:14px}
.card.flat{background:var(--cardS)}
.muted{color:var(--muted)}
.small{font-size:13px}
label.lab,legend.lab{display:block;font-weight:700;margin:14px 0 6px;font-size:14px;padding:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
input[type=text],input[type=number],select,textarea{width:100%;padding:12px 13px;border:2px solid var(--line);border-radius:12px;font:inherit;background:var(--cardS);color:var(--text)}
textarea{min-height:190px;resize:vertical;line-height:1.6}
textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;min-height:260px;white-space:pre;tab-size:2}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{position:relative;flex:1 1 auto}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.seg span{display:block;text-align:center;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--cardS);font-weight:700;transition:.15s}
.seg input:checked+span{border-color:var(--ac);background:var(--chip);color:var(--chipt)}
.seg input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.seg input:disabled+span{opacity:.45}
.seg label:hover span{transform:translateY(-1px)}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px}
.dc{background:var(--cardS);border:2px solid var(--line);border-radius:16px;padding:12px 6px;font-weight:800;transition:.15s;text-align:center}
.dc span{display:block;font-size:26px}
.dc:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.dc[aria-pressed=true]{border-color:var(--ac);background:var(--chip);color:var(--chipt)}
.btn{background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;border:0;font-weight:800;border-radius:13px;padding:13px 24px;transition:.15s;box-shadow:0 8px 20px rgba(79,70,229,.28)}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 26px rgba(79,70,229,.4)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.full{width:100%;margin-top:14px}
.btn.alt{background:var(--cardS);color:var(--text);border:2px solid var(--line);box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#dc2626,#b91c1c)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:10px;margin:0}
.gbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 13px;font-weight:700;font-size:14px}
.gbtn:hover{transform:translateY(-1px)}
.err,.warn,.info,.okb{border-radius:12px;padding:10px 14px;margin:10px 0;font-weight:600}
.err{background:var(--badbg);color:var(--bad);border:1px solid var(--bad)}
.warn{background:var(--midbg);color:var(--mid);border:1px solid var(--mid)}
.info{background:var(--chip);color:var(--chipt);border:1px solid var(--line)}
.okb{background:var(--okbg);color:var(--ok);border:1px solid var(--ok)}
.badge{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:800;margin:2px 6px 2px 0;background:var(--chip);color:var(--chipt)}
.badge.Easy,.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.Medium,.badge.mid{background:var(--midbg);color:var(--mid)}
.badge.Hard,.badge.bad{background:var(--badbg);color:var(--bad)}
.q{font-size:clamp(19px,4vw,26px);font-weight:800;line-height:1.35;margin:10px 0 4px}
.qorig{font-size:14px;color:var(--muted)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--cardS);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.stat small{display:block;color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.stat b{font-size:clamp(17px,3.2vw,23px);word-break:break-word}
.bar{height:10px;background:var(--ring);border-radius:10px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:10px;transition:width .5s}
.brow{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.brow .l{min-width:128px}.brow .v{min-width:38px;text-align:right;font-weight:800}
.prog{display:flex;justify-content:space-between;font-weight:800;margin-bottom:8px}
.layout{display:grid;grid-template-columns:1fr 280px;gap:14px;margin-top:14px}
.side{display:flex;flex-direction:column;gap:14px}
.side .card{margin:0}
.tc{text-align:center}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.item{background:var(--cardS);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;overflow-wrap:anywhere}
.chip{display:inline-block;background:var(--chip);color:var(--chipt);border-radius:99px;padding:3px 11px;margin:4px 5px 0 0;font-size:13px;font-weight:600}
.chip.bad{background:var(--badbg);color:var(--bad)}.chip.ok{background:var(--okbg);color:var(--ok)}
.sc{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ringsvg .rg{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.mcq label{display:flex;gap:10px;align-items:flex-start;background:var(--cardS);border:2px solid var(--line);border-radius:12px;padding:11px 14px;margin:8px 0;cursor:pointer}
.mcq label:has(input:checked){border-color:var(--ac);background:var(--chip)}
.mcq label:has(input:focus-visible){outline:3px solid var(--focus)}
.mcq.done label{cursor:default}
.mcq .right{border-color:var(--ok)!important;background:var(--okbg)!important}
.mcq .wrong{border-color:var(--bad)!important;background:var(--badbg)!important}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line)}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.tw{overflow-x:auto}
details{background:var(--cardS);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
summary{cursor:pointer;font-weight:700}
pre.code{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;font-size:13px;white-space:pre-wrap}
.warn10{animation:pulse 1s infinite}.fstat.ok{color:var(--ok);font-weight:600}.fstat.away{color:var(--bad);font-weight:700}
@keyframes pulse{50%{opacity:.55}}
.overlay{position:fixed;inset:0;background:rgba(2,6,23,.6);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--cardS);color:var(--text);border-radius:18px;max-width:440px;width:100%;padding:22px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.spin{display:inline-block;width:16px;height:16px;border:3px solid var(--line);border-top-color:var(--ac);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.foot{text-align:center;color:var(--muted);padding:6px 0 20px;font-size:13px}
@media(max-width:820px){
  .layout{grid-template-columns:1fr}.side{display:contents}
  .side>.tc{order:-2;position:sticky;top:6px;z-index:5;background:var(--cardS);backdrop-filter:none;display:grid;grid-template-columns:76px 1fr;align-items:center;column-gap:14px;text-align:left;padding:10px 14px}
  .side>.tc svg{grid-row:1/3;width:76px;height:76px}.side>.tc .lab{grid-column:2;align-self:end;margin:0}.side>.tc .small{grid-column:2;align-self:start}.side>.tc #tmWarn{grid-column:1/-1}
  .layout>div:first-child{order:-1}.side>.card:not(.tc){order:1}.side>button{order:2;justify-self:start}.cols,.row2{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}.brow .l{min-width:92px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media print{.top,.tools,.btn,.gbtn,.foot{display:none!important}body{background:#fff;color:#000}}

/* ---- mode cards ---- */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mc{position:relative;display:block}
.mc input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.mcb{display:flex;flex-direction:column;gap:2px;height:100%;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--cardS);transition:border-color .2s,box-shadow .2s,transform .2s}
.mci{font-size:26px;line-height:1.2}
.mcb b{font-size:16px}.mcb small{color:var(--muted);font-size:12.5px;line-height:1.35}
.mc:hover .mcb{transform:translateY(-2px)}
.mc input:checked+.mcb{border-color:var(--ac);background:var(--chip);box-shadow:0 0 0 3px rgba(79,70,229,.18),0 8px 26px rgba(79,70,229,.3)}
.mc input:focus-visible+.mcb{outline:3px solid var(--focus);outline-offset:2px}
.mc input:disabled{cursor:not-allowed}.mc input:disabled+.mcb{opacity:.45}.mc input:disabled+.mcb:hover{transform:none}
/* ---- live screen progress ---- */
.pc .qnum{font-size:38px;font-weight:900;line-height:1;margin:2px 0 10px;background:linear-gradient(90deg,var(--ac2),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
.pc .qnum span{font-size:20px;font-weight:700;color:var(--muted);-webkit-text-fill-color:var(--muted)}
.pc .bar{margin-bottom:6px}
/* ---- feedback accents ---- */
.fbg{border-top:4px solid var(--ok)}.fbi{border-top:4px solid var(--mid)}.fbr{border-top:4px solid var(--ac);background:linear-gradient(135deg,var(--chip),var(--card))}
@media (max-width:820px){.mgrid{grid-template-columns:1fr 1fr}.side>.card.pc{order:-2}}
@media (max-width:420px){.mgrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.mcb{transition:none}.mc:hover .mcb{transform:none}}

/* ---- wireframe layout ---- */
.aistat{display:inline-flex;align-items:center;padding:6px 12px;border-radius:99px;font-weight:800;font-size:12px;letter-spacing:.08em;border:1px solid var(--line);background:var(--cardS)}
.aistat.on{color:var(--ok);border-color:var(--ok)}.aistat.off{color:var(--mid);border-color:var(--mid)}
.row3{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:14px}
.row3 .seg span{padding:10px 8px}
.mcard{margin-bottom:14px}
.startbtn{min-width:min(100%,320px);font-size:17px;letter-spacing:.06em;text-transform:uppercase;margin-top:10px}
@media (max-width:820px){.row3{grid-template-columns:1fr}}

#toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:92vw;pointer-events:none}
#toasts>*{background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.tbtn{background:rgba(255,255,255,.85);color:#0f172a;border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700}
.tbtn:hover{transform:translateY(-1px)}
.skip{position:absolute;left:-999px;top:0;background:#fff;color:#000;padding:8px 12px;z-index:60}.skip:focus{left:8px;top:8px}
</style>
</head>

<main id="app" tabindex="-1"></main>
<div id="live" class="sr" aria-live="polite" role="status"></div>

focusH:"நேர்முகத் தேர்வு கவனக் கண்காணிப்பு",focusP1:"இதை ON செய்தால், நீங்கள் வேறு browser tab-க்கு மாறுவது, browser-ஐ சிறிதாக்குவது அல்லது சாளரம் focus இழப்பதை இந்தப் பக்கம் கண்டறியும். இது browser-ன் Page Visibility மற்றும் focus நிகழ்வுகளை மட்டுமே பயன்படுத்தும்.",focusP2:"ஒவ்வொரு நிகழ்வும் வகை, நேரம், கால அளவுடன் எண்ணப்படும்; நீங்கள் திரும்பியதும் நினைவூட்டல் தெரியும். நிகழ்வுகள் உங்கள் அறிக்கையில் காட்டப்படும். அவை உங்கள் மதிப்பெண்ணை ஒருபோதும் மாற்றாது; யாரையும் ஏமாற்றுபவர் என்று முத்திரை குத்தவும் பயன்படுத்தப்படாது.",focusP3:"வரம்புகள்: பிற சாதனங்கள் அல்லது பிற செயலிகளை இது பார்க்க முடியாது; உட்பொதிந்த frame-க்கு வெளியே கிளிக் செய்வதும் focus இழப்பாகத் தெரியலாம். கேமரா, மைக்ரோஃபோன், விசைப்பலகை, clipboard கண்காணிப்பு எதுவும் இல்லை.",focusAck:"இந்த அறிவிப்பைப் படித்தேன்; இந்தத் தேர்வுக்கு கவனக் கண்காணிப்பை ON செய்ய விரும்புகிறேன்.",focusLimit:"நினைவூட்டல் எல்லை (focus இழப்புகள்)",focusOk:"தேர்வுப் பக்கத்தில் உள்ளீர்கள்",focusAway:"தேர்வுப் பக்கத்தை விட்டு வெளியே",focusCount:"Focus இழப்புகள்",focusWarnN:"Focus எச்சரிக்கை {n}: நீங்கள் தேர்வுப் பக்கத்தை விட்டுச் சென்றீர்கள். தயவுசெய்து திரும்பி வந்து தொடருங்கள்.",focusStrong:"நீங்கள் {n} முறை பக்கத்தை விட்டுச் சென்றுள்ளீர்கள் (நினைவூட்டல் எல்லை: {l}). முடிக்கும் வரை இந்தப் பக்கத்திலேயே இருங்கள்.",focusNoPenalty:"இது ஒரு நினைவூட்டல் மட்டுமே. உங்கள் மதிப்பெண்ணை மாற்றாது.",focusDismiss:"சரி, திரும்பிவிட்டேன்",focusNote:"கண்காணிப்பு ON. tab மாற்றம், சிறிதாக்கம், சாளர focus மாற்றம் மட்டுமே கண்டறியப்படும்.",focusOffNote:"இந்தத் தேர்வுக்கு கவனக் கண்காணிப்பு OFF.",focusSum:"கவனச் சுருக்கம்",focusWasOff:"இந்தத் தேர்வுக்கு கவனக் கண்காணிப்பு OFF ஆக இருந்தது.",focusEvent:"நிகழ்வு",focusTime:"நேரம்",focusAwayFor:"வெளியே இருந்த நேரம்",focusNone:"Focus இழப்பு நிகழ்வுகள் எதுவும் கண்டறியப்படவில்லை.",focusTab:"Tab-ஐ விட்டுச் சென்றார் / சிறிதாக்கினார்",focusWin:"சாளரம் focus இழந்தது",focusLimitNote:"browser tab மாற்றம், சிறிதாக்கம், focus மாற்றம் ஆகியவற்றை மட்டுமே தெரிவிக்கும்; பிற சாதனங்கள் அல்லது browser-க்கு வெளியே நடப்பதை அறிய முடியாது.",

speakIn:"பேசும் மொழி",micLive:"கேட்கிறது… இப்போது பேசுங்கள். நீங்கள் பேசுவது பதில் பெட்டியில் தட்டச்சாகும்.",micDenied:"இந்த உட்பொதிந்த பக்கத்தில் மைக்ரோஃபோன் தடுக்கப்பட்டுள்ளது. பதிவிறக்கிய HTML கோப்பை Chrome அல்லது Edge-ல் திறக்கவும் (அல்லது முகவரிப் பட்டியில் உள்ள பூட்டு படத்திலிருந்து மைக்ரோஃபோனை அனுமதிக்கவும்), பிறகு மீண்டும் முயலவும். தட்டச்சும் செய்யலாம்.",micNet:"பேச்சு அறிதலுக்கு இணைய இணைப்பு தேவை. சரிபார்க்கவும் அல்லது தட்டச்சு செய்யவும்.",micLangNo:"தேர்ந்தெடுத்த மொழியை இந்த உலாவி அறியாது. Chrome அல்லது Edge-ஐ முயலவும், அல்லது தட்டச்சு செய்யவும்.",micNoDev:"மைக்ரோஃபோன் கிடைக்கவில்லை. இணைக்கவும் அல்லது தட்டச்சு செய்யவும்.",

/* ===================== SCORING ===================== */
const Scoring={
  TEXT_W:{relevance:.25,technical:.30,clarity:.15,communication:.15,completeness:.15},
  CODE_W:{correctness:.40,efficiency:.20,readability:.20,edgeCases:.20},
  weighted(dims,W){let s=0,w=0;for(const k in W){const v=dims[k];if(typeof v==="number"&&isFinite(v)){s+=v*W[k];w+=W[k]}}return w>0?r1(s/w):null},
  /* Final score of one result, or null when it must be excluded from the average */
  qScore(r){
    if(r.status==="unanswered")return 0;
    if(r.status==="auto")return r.main;
    if(r.status!=="evaluated"||typeof r.main!=="number")return null;
    let s=r.main;
    if(r.kind==="code"&&r.tests&&r.tests.executed&&r.tests.total>0){s=r1(0.5*r.main+0.5*10*(r.tests.passed/r.tests.total))}
    if(r.follow&&r.follow.state==="done"&&typeof r.follow.score==="number"){s=r1(0.8*s+0.2*r.follow.score)}
    return clamp(s,0,10);
  },
  stats(results,planned){
    const scored=results.map(r=>({r,s:this.qScore(r)}));
    const valid=scored.filter(x=>x.s!==null);
    const answered=results.filter(r=>r.status==="evaluated"||r.status==="auto"||r.status==="unevaluated").length;
    const dimSum={},dimN={};
    results.filter(r=>r.status==="evaluated"&&r.ev&&r.ev.dims&&r.kind==="text").forEach(r=>{
      for(const k in r.ev.dims){const v=r.ev.dims[k];if(typeof v==="number"){dimSum[k]=(dimSum[k]||0)+v;dimN[k]=(dimN[k]||0)+1}}});
    const dims={};Object.keys(dimSum).forEach(k=>dims[k]=r1(dimSum[k]/dimN[k]));
    const group=f=>{const g={};valid.forEach(x=>{const key=f(x.r);(g[key]=g[key]||[]).push(x.s)});const o={};Object.keys(g).forEach(k=>o[k]=r1(avg(g[k])));return o};
    return{
      planned,total:results.length,
      overall:valid.length?r1(avg(valid.map(x=>x.s))):null,
      scoredN:valid.length,answered,
      completion:results.length?Math.round(100*answered/results.length):0,
      aiN:results.filter(r=>r.status==="evaluated").length,
      autoN:results.filter(r=>r.status==="auto").length,
      unansweredN:results.filter(r=>r.status==="unanswered").length,
      timedOutN:results.filter(r=>r.timedOut).length,
      unevalN:results.filter(r=>r.status==="unevaluated"||r.status==="pending").length,
      dims,byCat:group(r=>r.cat),byDiff:group(r=>r.diff),
      scores:scored.map(x=>x.s)
    };
  },
  weakTopics(results){
    const g={};results.forEach(r=>{const s=this.qScore(r);if(s===null)return;const k=r.topic||r.cat;(g[k]=g[k]||[]).push(s)});
    return Object.keys(g).map(k=>({topic:k,score:r1(avg(g[k]))})).sort((a,b)=>a.score-b.score);
  },
  /* Adaptive difficulty: rolling mean of last 2 valid scores; one step at most */
  nextLevel(level,results){
    const last=results.map(r=>this.qScore(r)).filter(s=>s!==null).slice(-2);
    if(!last.length)return level;
    const m=avg(last);let i=LEVELS.indexOf(level);
    if(m>=8)i=Math.min(2,i+1);else if(m<=4)i=Math.max(0,i-1);
    return LEVELS[i];
  }
};

/* ---------- Validation of AI replies ---------- */
const Val={
  num(v){if(v===null||v===undefined||v==="n/a"||v==="N/A")return null;const n=Number(v);if(!isFinite(n))throw new Error("invalid number");return r1(clamp(n,0,10))},
  list(v,max=5,len=500){if(v==null)return[];if(typeof v==="string")v=[v];if(!Array.isArray(v))return[];return v.filter(x=>typeof x==="string"||typeof x==="number").map(x=>String(x).trim().slice(0,len)).filter(Boolean).slice(0,max)},
  str(v,len=2500){return typeof v==="string"?v.trim().slice(0,len):""},
  bool(v){return v===true||v==="true"},
  textEval(raw,isHR){
    if(!raw||typeof raw!=="object"||Array.isArray(raw))throw new Error("reply is not an object");
    const dims={};
    for(const k of["relevance","technical","clarity","communication","completeness"])dims[k]=this.num(raw[k]);
    if(isHR&&dims.technical===null){/* allowed: not applicable for HR */}
    const have=Object.values(dims).filter(v=>v!==null).length;
    if(have<3||dims.relevance===null)throw new Error("too few valid scores");
    const s=raw.star&&typeof raw.star==="object"?raw.star:{};
    const main=Scoring.weighted(dims,Scoring.TEXT_W);
    if(main===null)throw new Error("no score");
    return{dims,main,verdict:this.str(raw.verdict,300),strengths:this.list(raw.strengths),improvements:this.list(raw.improvements),
      mistakes:this.list(raw.mistakes),tips:this.list(raw.tips),sample:this.str(raw.sample_answer),keyTerms:this.list(raw.key_terms,8,80),
      missing:this.list(raw.missing_concepts,6,120),
      star:{applicable:isHR&&this.bool(s.applicable),S:this.bool(s.situation),T:this.bool(s.task),A:this.bool(s.action),R:this.bool(s.result),tip:this.str(s.suggestion,300)},
      followUp:this.str(raw.follow_up,300),
      confidence:(()=>{const cf=raw.confidence&&typeof raw.confidence==="object"&&!Array.isArray(raw.confidence)?raw.confidence:{},lv=String(cf.level||"").toLowerCase();return{level:["low","moderate","high"].includes(lv)?lv:"",signals:this.list(cf.signals,3,200),suggestions:this.list(cf.suggestions,3,300)}})(),commTips:this.list(raw.communication_tips,3,300)};
  },
  codeEval(raw){

    const dims={};
    for(const k of["correctness","efficiency","readability","edgeCases"])dims[k]=this.num(raw[k==="edgeCases"?"edge_cases":k]);

/* ===================== CODE RUNNER (isolated iframe + Worker) ===================== */
/* Layers: sandboxed iframe (opaque origin, scripts only) + CSP that blocks all network
   + Worker that is terminated on time-out. Code never runs in the app's own context.
   This is best-effort isolation for practice; it is NOT a production-grade sandbox. */
function _workerMain(){
  const pm=self.postMessage.bind(self);
  self.onmessage=function(e){
    const d=e.data;
    try{self.fetch=undefined;self.XMLHttpRequest=undefined;self.WebSocket=undefined;self.importScripts=undefined;self.postMessage=undefined}catch(_){}
    let f;
    try{f=(new Function(d.code+"\n;return (typeof "+d.fn+"==='function')?"+d.fn+":null;"))()}
    catch(err){pm({t:"fatal",error:((err&&err.name)||"Error")+": "+((err&&err.message)||String(err))});return}
    if(!f){pm({t:"fatal",error:"Function '"+d.fn+"' not found. Keep the given function name."});return}
    d.tests.forEach(function(tc,i){
      try{
        const args=JSON.parse(JSON.stringify(tc[0]));
        const got=f.apply(null,args);
        let gs;try{gs=JSON.stringify(got)}catch(_){gs=String(got)}
        if(gs===undefined)gs="undefined";
        let ok;
        if(d.sort&&Array.isArray(got)&&Array.isArray(tc[1])){ok=JSON.stringify(got.slice().sort())===JSON.stringify(tc[1].slice().sort())}
        else ok=gs===JSON.stringify(tc[1]);
        pm({t:"case",i:i,ok:ok,got:gs});
      }catch(err){pm({t:"case",i:i,ok:false,error:((err&&err.name)||"Error")+": "+((err&&err.message)||String(err))})}
    });
    pm({t:"done"});
  };
}
function _iframeMain(nonce){
  let w;
  function send(m){m.nonce=nonce;parent.postMessage(m,"*")}
  try{w=new Worker(URL.createObjectURL(new Blob([WORKER_SRC],{type:"text/javascript"})))}
  catch(err){send({t:"init-fail",error:String(err)});return}
  let timer=null;
  w.onerror=function(ev){send({t:"fatal",error:"Runtime error: "+(ev.message||"unknown")})};
  w.onmessage=function(e){const m=e.data;if(m&&m.t==="done")clearTimeout(timer);send(m)};
  window.addEventListener("message",function(e){
    if(e.source!==parent)return;const m=e.data;if(!m||m.nonce!==nonce||m.t!=="run")return;
    w.postMessage(m.payload);
    timer=setTimeout(function(){try{w.terminate()}catch(_){}send({t:"timeout"})},m.timeout);
  });
  send({t:"ready"});
}
const Runner={
  state:null,/* null=unknown, true=works, false=unavailable */
  srcdoc(nonce){
    return '<!doctype html><meta http-equiv="Content-Security-Policy" content="default-src \'none\'; script-src \'unsafe-inline\' \'unsafe-eval\'; worker-src blob:"><script>const WORKER_SRC='+JSON.stringify("("+_workerMain.toString()+")()")+';('+_iframeMain.toString()+')('+JSON.stringify(nonce)+');<\/script>';
  },
  run(q,code,timeoutMs=3000){
    return new Promise(resolve=>{
      const nonce=Math.random().toString(36).slice(2)+Date.now();
      const ifr=document.createElement("iframe");
      ifr.setAttribute("sandbox","allow-scripts");ifr.setAttribute("aria-hidden","true");ifr.tabIndex=-1;ifr.title="code runner";
      ifr.style.cssText="position:absolute;width:0;height:0;border:0;visibility:hidden";
      const rows=q.tests.map(()=>null);
      let done=false,rt=null,ht=null,extra={};
      const finish=(x)=>{
        if(done)return;done=true;clearTimeout(rt);clearTimeout(ht);window.removeEventListener("message",on);ifr.remove();
        extra=Object.assign(extra,x||{});
        const out=rows.map((r,i)=>{
          const tc=q.tests[i],input=tc[0].map(a=>JSON.stringify(a)).join(", "),expected=JSON.stringify(tc[1]);
          if(!r)return{input,expected,got:extra.timedOut?"(not run: time limit)":(extra.error?"(not run)":"(no result)"),ok:false,notRun:true};
          return{input,expected,got:r.error?r.error:r.got,ok:!!r.ok,error:r.error||null};
        });
        const passed=out.filter(r=>r.ok).length;
        if(extra.unavailable){Runner.state=false}else{Runner.state=true}
        resolve({executed:!extra.unavailable,unavailable:!!extra.unavailable,error:extra.error||null,timedOut:!!extra.timedOut,rows:out,passed,total:out.length});
      };
      function on(e){
        if(e.source!==ifr.contentWindow)return;const m=e.data;if(!m||m.nonce!==nonce)return;
        if(m.t==="ready"){clearTimeout(rt);
          ifr.contentWindow.postMessage({t:"run",nonce,timeout:timeoutMs,payload:{code,fn:q.fn,sort:!!q.sort,tests:q.tests}},"*");
          ht=setTimeout(()=>finish({timedOut:true}),timeoutMs+2000)}
        else if(m.t==="case"&&Number.isInteger(m.i)&&m.i>=0&&m.i<rows.length){rows[m.i]={ok:m.ok===true,got:String(m.got).slice(0,200),error:m.error?String(m.error).slice(0,300):null}}
        else if(m.t==="done")finish();
        else if(m.t==="timeout")finish({timedOut:true});
        else if(m.t==="fatal")finish({error:String(m.error).slice(0,400)});
        else if(m.t==="init-fail")finish({unavailable:true,error:"The isolated runner could not start: "+String(m.error).slice(0,200)});
      }
      window.addEventListener("message",on);
      ifr.srcdoc=this.srcdoc(nonce);
      document.body.appendChild(ifr);
      rt=setTimeout(()=>finish({unavailable:true,error:"The isolated runner did not start in this browser."}),3000);
    });
  }
};

/* ===================== TIMER (timestamp based) ===================== */
const Timer={
  id:null,deadline:0,limit:0,fired:true,warned:false,token:0,
  start(limitSec,onTick,onExpire){
    this.stop();this.token++;const tok=this.token;
    this.limit=limitSec;this.deadline=Date.now()+limitSec*1000;this.fired=false;this.warned=false;
    const tick=()=>{
      if(tok!==this.token||this.fired)return;
      const ms=this.deadline-Date.now(),rem=Math.max(0,Math.ceil(ms/1000));
      onTick(rem,this.limit);
      if(ms<=0){this.fired=true;this.stop(true);onExpire()}
    };
    this.tickFn=tick;this.id=setInterval(tick,250);tick();
  },
  stop(keepFired){clearInterval(this.id);this.id=null;if(!keepFired)this.fired=true},
  tickNow(){if(this.tickFn&&this.id)this.tickFn()}
};
document.addEventListener("visibilitychange",()=>{if(!document.hidden)Timer.tickNow()});

/* ===================== FOCUS MONITORING (transparent, opt-in, informational only) =====================
   Uses ONLY the browser's own events: Page Visibility (visibilitychange / document.hidden) and window focus/blur.
   It never changes a score, never fails a candidate, and records nothing except event type, time and duration. */
const FocusMon={
  blurTimer:null,grace:0,
  active(){const r=S.run;return !!(r&&r.focus&&S.screen==="interview"&&r.cfg.focus&&r.cfg.focus.on)},
  pause(ms){this.grace=Date.now()+ms},                       /* e.g. while the browser shows a microphone prompt */
  lose(type){
    if(!this.active())return;const f=S.run.focus;if(f.away)return;           /* one loss at a time: blur + hidden is counted once */
    if(type==="window_blur"&&(Date.now()<this.grace||(S.cur&&S.cur.phase==="evaluating")))return;  /* permission dialogs during AI calls are not counted */
    f.away={type,at:Date.now()};f.count++;f.events.push({ty:type,at:f.away.at,ms:null});this.paint();
  },
  back(){
    if(!this.active())return;const r=S.run,f=r.focus;if(!f.away)return;
    const a=f.away,ms=Date.now()-a.at;f.away=null;const ev=f.events[f.events.length-1];if(ev&&ev.ms===null)ev.ms=ms;
    f.warn={n:f.count,type:a.type,ms,strong:f.count>=r.cfg.focus.limit};this.paint();
  },
  onBlur(){clearTimeout(this.blurTimer);this.blurTimer=setTimeout(()=>{if(!document.hidden&&typeof document.hasFocus==="function"&&!document.hasFocus())this.lose("window_blur")},600)},
  onFocus(){clearTimeout(this.blurTimer);this.back()},
  onVis(){
    if(document.hidden){clearTimeout(this.blurTimer);this.lose("tab_hidden")}
    else{const f=S.run&&S.run.focus;if(f&&f.away&&f.away.type==="tab_hidden")this.back()}
  },
  dismiss(){const r=S.run;if(r&&r.focus){r.focus.warn=null;this.paint()}},
  typeName(ty){return ty==="tab_hidden"?t("focusTab"):t("focusWin")},
  liveHTML(r){const f=r.focus;return`${f.away?"🔴 "+esc(t("focusAway")):"🟢 "+esc(t("focusOk"))} · ${esc(t("focusCount"))}: <b>${f.count}</b> / ${r.cfg.focus.limit}`},
  warnHTML(r){
    const f=r.focus;if(!f||!f.warn||!r.cfg.focus||!r.cfg.focus.on)return"";const w=f.warn;
    return`<div class="warn ${w.strong?"warn10":""}" role="alert"><b>⚠ ${esc(t("focusWarnN").replace("{n}",w.n))}</b>${w.strong?`<br>${esc(t("focusStrong").replace("{n}",f.count).replace("{l}",r.cfg.focus.limit))}`:""}<div class="small" style="margin-top:4px">${esc(t("focusNoPenalty"))}</div><button class="btn alt sm" data-act="focusOk" style="margin-top:6px">${esc(t("focusDismiss"))}</button></div>`;
  },
  card(r){
    if(!r.cfg.focus||!r.cfg.focus.on)return`<div class="card"><div class="lab" style="margin-top:0">👁 ${esc(t("focusH"))}</div><p class="small muted">${esc(t("focusOffNote"))}</p></div>`;
    return`<div class="card"><div class="lab" style="margin-top:0">👁 ${esc(t("focusH"))}</div><div id="focusLive" class="fstat ${r.focus.away?"away":"ok"}" role="status">${this.liveHTML(r)}</div><p class="small muted" style="margin-bottom:0">${esc(t("focusNote"))}</p></div>`;
  },
  paint(){
    const r=S.run;if(!r||!r.focus||!r.cfg.focus||!r.cfg.focus.on)return;
    const live=document.getElementById("focusLive");if(live){live.className="fstat "+(r.focus.away?"away":"ok");live.innerHTML=this.liveHTML(r)}
    const w=document.getElementById("focusWarn");if(w)w.innerHTML=this.warnHTML(r);
  },
  fmtMs(ms){if(ms==null)return"–";const s=Math.round(ms/1000);return s<60?s+" s":Math.floor(s/60)+" min "+(s%60)+" s"},
  summaryHTML(run){
    const c=run.cfg.focus,f=run.focus;
    if(!c||!c.on)return`<div class="card"><h2>👁 ${esc(t("focusSum"))}</h2><p class="muted">${esc(t("focusWasOff"))}</p></div>`;
    const rows=f.events.map((e,i)=>`<tr><td>${i+1}</td><td>${esc(this.typeName(e.ty))}</td><td>${esc(new Date(e.at).toLocaleTimeString())}</td><td>${esc(this.fmtMs(e.ms))}</td></tr>`).join("");
    return`<div class="card"><h2>👁 ${esc(t("focusSum"))}</h2><div class="grid4"><div class="stat"><small>${esc(t("focusCount"))}</small><b>${f.count}</b></div><div class="stat"><small>${esc(t("focusLimit"))}</small><b>${c.limit}</b></div></div>
    ${f.count>=c.limit?`<div class="warn" role="status">${esc(t("focusStrong").replace("{n}",f.count).replace("{l}",c.limit))}</div>`:""}
    ${rows?`<div class="tw"><table class="tbl"><thead><tr><th>#</th><th>${esc(t("focusEvent"))}</th><th>${esc(t("focusTime"))}</th><th>${esc(t("focusAwayFor"))}</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<p class="muted">${esc(t("focusNone"))}</p>`}
    <p class="small muted">${esc(t("focusNoPenalty"))} ${esc(t("focusLimitNote"))}</p></div>`;
  },
  reportHTML(run){
    const c=run.cfg.focus,f=run.focus,E=esc;
    if(!c||!c.on)return`<h2>Focus summary</h2><p>Focus monitoring was OFF for this interview.</p>`;
    const rows=f.events.map((e,i)=>`<tr><td>${i+1}</td><td>${e.ty==="tab_hidden"?"Left the tab / minimised":"Window lost focus"}</td><td>${E(new Date(e.at).toLocaleTimeString())}</td><td>${E(this.fmtMs(e.ms))}</td></tr>`).join("");
    return`<h2>Focus summary</h2><p>Focus-loss events detected: <b>${f.count}</b> (reminder threshold: ${c.limit}).</p>${rows?`<table><tr><th>#</th><th>Event</th><th>Time</th><th>Away for</th></tr>${rows}</table>`:"<p>No focus-loss events were detected.</p>"}<p class="tag">Informational only. Focus events never changed the score and do not prove or disprove anything. The browser only reports tab switches, minimising and window focus changes; it cannot see other devices or other apps.</p>`;
  },
  csvLines(run,cell){

    return L;
  }
};

const Speech={
  rec:null,
  voices(){try{return window.speechSynthesis?window.speechSynthesis.getVoices():[]}catch(e){return[]}},
  canSpeak(){return typeof window.speechSynthesis!=="undefined"&&typeof window.SpeechSynthesisUtterance!=="undefined"},

  },
  speak(text,lang){

  },
  stopSpeak(){try{window.speechSynthesis&&window.speechSynthesis.cancel()}catch(e){}},
  canListen(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition)},
  micMsg(c){return c==="not-allowed"||c==="service-not-allowed"?t("micDenied"):c==="network"?t("micNet"):c==="language-not-supported"?t("micLangNo"):c==="audio-capture"?t("micNoDev"):t("micFail")},
  listen(lang,onText,onEnd,onErr,onInterim){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){onErr(t("noMic"));return null}
    const me=this;let stopped=false,restarts=0;
    const begin=()=>{
      const r=new SR();r.lang=lang==="ta"?"ta-IN":"en-IN";r.interimResults=true;r.continuous=true;r.maxAlternatives=1;
      r.onresult=e=>{let fin="",tmp="";for(let i=e.resultIndex;i<e.results.length;i++){const tr=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=tr;else tmp+=tr}
        if(fin.trim())onText(fin.trim());if(onInterim)onInterim(tmp)};
      r.onerror=e=>{const c=e&&e.error;if(c==="no-speech"||c==="aborted")return;stopped=true;onErr(me.micMsg(c))};
      r.onend=()=>{if(!stopped&&me.rec===r&&restarts<40){restarts++;try{begin();return}catch(x){}}stopped=true;onEnd()};

  },

/* ===================== FILE READING (resume) ===================== */
const Files={
  loaded:{},
  loadScript(url){
    if(this.loaded[url])return this.loaded[url];
    this.loaded[url]=new Promise((res,rej)=>{const s=document.createElement("script");s.src=url;s.onload=res;s.onerror=()=>{delete Files.loaded[url];rej(new Error("load failed"))};document.head.appendChild(s)});
    return this.loaded[url];
  },
  async read(file){
    if(file.size>5*1024*1024)throw{code:"big"};
    const name=(file.name||"").toLowerCase();
    const buf=await file.arrayBuffer();const head=new Uint8Array(buf.slice(0,4));
    const isPdf=head[0]===0x25&&head[1]===0x50&&head[2]===0x44&&head[3]===0x46;
    const isZip=head[0]===0x50&&head[1]===0x4B;
    let text="";
    if(name.endsWith(".txt")){text=new TextDecoder("utf-8").decode(buf)}
    else if(name.endsWith(".pdf")&&isPdf){
      try{await this.loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js")}catch(e){throw{code:"lib"}}
      try{
        const pdfjs=window.pdfjsLib;pdfjs.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        const doc=await pdfjs.getDocument({data:new Uint8Array(buf)}).promise;
        for(let p=1;p<=Math.min(doc.numPages,8);p++){const pg=await doc.getPage(p);const c=await pg.getTextContent();text+=c.items.map(i=>i.str).join(" ")+"\n"}
      }catch(e){throw{code:"bad"}}
    }
    else if(name.endsWith(".docx")&&isZip){
      try{await this.loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js")}catch(e){throw{code:"lib"}}
      try{const r=await window.mammoth.extractRawText({arrayBuffer:buf});text=r.value}catch(e){throw{code:"bad"}}
    }
    else throw{code:"bad"};
    text=text.replace(/[ \t]+/g," ").trim();
    if(text.length<60)throw{code:"empty"};
    return text.slice(0,9000);
  }
};

const scoreVar=v=>v>=7?"var(--ok)":v>=5?"var(--mid)":"var(--bad)";
const scoreCls=v=>v>=7?"ok":v>=5?"mid":"bad";
function ring(v,size,cap){
  const C=326.7,val=v==null?0:v,off=C*(1-val/10);
  return`<svg class="ringsvg" width="${size}" height="${size}" viewBox="0 0 120 120" role="img" aria-label="${v==null?"n/a":val+" / 10"}"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--ring)" stroke-width="10"/>
  <circle class="rg" data-o="${off}" cx="60" cy="60" r="52" fill="none" stroke="${v==null?"var(--line)":scoreVar(val)}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 60 60)"/>
  <text x="60" y="${cap?62:68}" text-anchor="middle" font-size="${cap?28:30}" font-weight="800" fill="var(--text)">${v==null?"–":r1(val)}</text>${cap?`<text x="60" y="82" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(cap)}</text>`:""}</svg>`;
}
function animateRings(){setTimeout(()=>{$$(".rg").forEach(e=>{e.style.strokeDashoffset=e.getAttribute("data-o")})},60)}
function bar(label,v){return`<div class="brow"><span class="l">${esc(label)}</span><div class="bar" role="img" aria-label="${esc(label)} ${v==null?"n/a":v+"/10"}"><i style="width:${v==null?0:v*10}%;background:${v==null?"transparent":scoreVar(v)}"></i></div><span class="v">${v==null?"–":v}</span></div>`}
const li=a=>(a||[]).map(x=>`<div class="item">${esc(x)}</div>`).join("");

}

function notify(msg,kind){
  const box=$("#toasts");if(!box)return;
  const d=document.createElement("div");d.className=kind||"info";d.textContent=msg;box.appendChild(d);
  const live=$("#live");if(live)live.textContent=msg;
  setTimeout(()=>d.remove(),5000);
}
function confirmDialog(msg,okLabel){
  return new Promise(res=>{
    const prev=document.activeElement;
    const o=document.createElement("div");o.className="overlay";
    o.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mdt"><p id="mdt" style="margin:0;font-weight:700">${esc(msg)}</p><div class="acts"><button class="btn alt sm" data-x="0">${esc(t("cancel"))}</button><button class="btn danger sm" data-x="1">${esc(okLabel||t("confirm"))}</button></div></div>`;
    const close=v=>{o.remove();document.removeEventListener("keydown",kd,true);prev&&prev.focus&&prev.focus();res(v)};
    const kd=e=>{if(e.key==="Escape"){e.preventDefault();close(false)}
      if(e.key==="Tab"){const b=$$("button",o);if(!b.length)return;const f=b[0],l=b[b.length-1];if(e.shiftKey&&document.activeElement===f){e.preventDefault();l.focus()}else if(!e.shiftKey&&document.activeElement===l){e.preventDefault();f.focus()}}};
    o.addEventListener("click",e=>{const x=e.target.closest("[data-x]");if(x)close(x.dataset.x==="1");else if(e.target===o)close(false)});
    document.addEventListener("keydown",kd,true);document.body.appendChild(o);$("[data-x='0']",o).focus();
  });
}

  const ae=document.activeElement;const aid=ae&&ae.id&&app.contains(ae)?ae.id:null;
  let ss=null,se=null;if(aid&&ae.selectionStart!=null){try{ss=ae.selectionStart;se=ae.selectionEnd}catch(e){}}
  document.documentElement.lang=LANG==="ta"?"ta":"en";document.title=t("title");
  app.innerHTML=S.screen==="home"?viewHome():S.screen==="interview"?viewInterview():viewFinal();
  const hb=$("#hdrTitle");if(hb)hb.textContent=t("title");
  const as=$("#aiStat");if(as){const on=AI.ready&&AI.available();as.className="aistat "+(on?"on":"off");as.textContent="● "+t(on?"aiReady":"aiOffline")}
  const lb=$("#langBtn");if(lb){lb.textContent=LANG==="ta"?"English":"தமிழ்";lb.style.display=S.screen==="home"?"":"none";lb.lang=LANG==="ta"?"en":"ta"}
  const tb=$("#themeBtn");if(tb)tb.textContent="🌓 "+t("theme");
  if(aid){const n=document.getElementById(aid);if(n){n.focus({preventScroll:true});if(ss!=null&&n.setSelectionRange){try{n.setSelectionRange(ss,se)}catch(e){}}}}
  window.scrollTo(0,y);animateRings();
  if(S.screen==="interview")afterInterviewRender();
}

function weakTopicsFromHistory(items){
  const g={};items.forEach(it=>it.qs.forEach(q=>{if(typeof q.s==="number"){const k=q.tp||q.c;(g[k]=g[k]||[]).push(q.s)}}));
  return Object.keys(g).map(k=>({topic:k,score:r1(avg(g[k])),n:g[k].length})).filter(x=>x.n>=1).sort((a,b)=>a.score-b.score).slice(0,5);
}
function viewHistory(){
  const h=S.hist;let out=`<div class="card" id="histCard"><h2>${esc(t("histH"))}</h2><p class="muted small">${esc(t("histNote"))}</p>`;

  if(h.corrupted)out+=`<div class="warn">${esc(t("corrupt"))} <button class="btn sm" data-act="clearCorrupt">${esc(t("clearCorrupt"))}</button></div>`;
  if(S.storeMsg)out+=`<div class="warn">${esc(S.storeMsg)}</div>`;
  if(!h.items.length){out+=`<div class="info">${esc(t("histEmpty"))}</div></div>`;return out}
  const items=h.items;
  const sc=items.filter(i=>typeof i.overall==="number");
  if(sc.length>=2){
    const a=sc[0],b=sc[1],d=r1(a.overall-b.overall);
    out+=`<div class="grid4"><div class="stat"><small>${esc(t("prev"))}</small><b>${b.overall}/10</b></div><div class="stat"><small>${esc(t("curr"))}</small><b>${a.overall}/10</b></div><div class="stat"><small>${esc(t("chg"))}</small><b style="color:${d>=0?"var(--ok)":"var(--bad)"}">${d>0?"+":""}${d}</b></div><div class="stat"><small>${esc(t("trend"))}</small><b>${sc.slice(0,6).reverse().map(x=>x.overall).join(" → ")}</b></div></div>
    <p class="muted small">${esc(t("histTrendNote"))}. ${a.rv===b.rv?"":"⚠ Different scoring rubric versions."}</p>`;
  }
  const wk=weakTopicsFromHistory(items);

/* ===================== UI PART 2: interview flow ===================== */
const LANG_NAME={javascript:"JavaScript",python:"Python",java:"Java",cpp:"C++"};
const snake=s=>s.replace(/([A-Z])/g,m=>"_"+m.toLowerCase());

/* ---------- question selection ---------- */
function bankFor(cat,dept,lv){
  if(cat==="HR")return HRB[lv].concat(((HRX[streamOf(dept)]||{})[lv])||[]).map(([text,topic])=>({id:"hr:"+hash(text),text,cat:"HR",diff:lv,topic,src:"bank",kind:"text"}));
  if(cat==="Technical"){const a=(TECH[dept]||"").split("|").filter(Boolean),r={Easy:[0,9],Medium:[9,18],Hard:[18,25]}[lv];
    const extra=((TECHX[dept]||{})[lv]||"").split("|").filter(Boolean);
    return a.slice(r[0],r[1]).concat(extra).map(text=>({id:"t:"+dept+":"+hash(text),text,cat:"Technical",diff:lv,topic:dept,src:"bank",kind:"text"}))}
  if(cat==="Aptitude")return APT[lv].map(x=>({id:"a:"+hash(x.q),text:x.q,cat:"Aptitude",diff:lv,topic:x.t,src:"bank",kind:"mcq",mcq:x}));
  if(cat==="Coding")return CODEQ.filter(c=>c.d===lv).map(c=>({id:c.id,text:c.title,cat:"Coding",diff:lv,topic:c.t,src:"bank",kind:"code",code:c}));
  return[];
}
function pickFromBank(cat,dept,level,asked,role){
  const i=LEVELS.indexOf(level),order=LEVELS.slice().sort((a,b)=>Math.abs(LEVELS.indexOf(a)-i)-Math.abs(LEVELS.indexOf(b)-i));
  const set=cat==="HR"?(role==="open"?HR_OPEN:role==="close"?HR_CLOSE:null):null;   /* mock interview: opening / closing HR pools */
  for(const useSet of(set?[true,false]:[false])){
    for(const lv of order){const pool=bankFor(cat,dept,lv).filter(q=>!asked.has(q.id)&&(!useSet||set.has(q.text)));if(pool.length)return pool[Math.floor(Math.random()*pool.length)]}
  }
  return null;
}
/* A question may be skipped only if something else (other than the mock closing question) is still ahead of it. */
function canSkip(run,cur){
  if(!run||!cur||cur.phase!=="answer"||cur.slot.deferred||cur.slot.role)return false;
  return run.queue.some(s=>!(run.cfg.mock&&s.role==="close"));
}
function buildSlots(cfg,resumeQs,customQs,roleQs){
  const n=cfg.n,lvl=cfg.diff==="Adaptive"?"Medium":cfg.diff;let note="";
  const codingOnly=cfg.mode==="Coding",aptOnly=cfg.mode==="Aptitude";
  /* Mock interview = HR opening -> technical / coding -> HR closing. Not available for Coding or Aptitude. */
  const mock=!!cfg.mock&&!codingOnly&&!aptOnly&&n>=5;
  /* Coding mode is 100% coding questions: custom and resume questions are not used. */
  if(codingOnly){if(customQs.length||resumeQs.length)note=t("codingOnlyNote");customQs=[];resumeQs=[]}
  const fixedMax=mock?Math.max(0,n-3):n;            /* a mock interview always keeps room for HR opening + closing */
  const fixed=[];
  customQs.slice(0,Math.min(5,fixedMax)).forEach(text=>fixed.push({cat:"Custom",fixed:{id:"u:"+hash(text),text,cat:"Custom",diff:lvl,topic:"Custom",src:"custom",kind:"text"}}));
  let rem=n-fixed.length;
  const rcap=cfg.mode==="Resume-based"?Math.max(1,Math.ceil(rem/2)):Math.ceil(rem/3);
  resumeQs.slice(0,Math.max(0,Math.min(rcap,rem,fixedMax-fixed.length))).forEach(text=>{fixed.push({cat:"Resume",fixed:{id:"r:"+hash(text),text,cat:"Resume",diff:lvl,topic:"Resume",src:"ai-resume",kind:"text"}})});
  if(!codingOnly&&!aptOnly&&(cfg.mode==="Technical"||cfg.mode==="Mixed")&&roleQs&&roleQs.length){
    const room=Math.max(0,fixedMax-fixed.length),k=Math.min(roleQs.length,2,room);   /* at most 2 role questions, so most technical questions stay specific to the department / course */
    roleQs.slice(0,k).forEach(x=>fixed.push({cat:"Technical",fixed:{id:"ro:"+hash(x.text),text:x.text,cat:"Technical",diff:lvl,topic:x.topic,src:x.src,kind:"text"}}));
  }
  rem=n-fixed.length;
  let hr=0,tech=0,code=0,apt=0;
  if(codingOnly){code=Math.min(CODEQ.length,rem)}
  else if(aptOnly){apt=Math.min(rem,APT.Easy.length+APT.Medium.length+APT.Hard.length)}
  else if(mock){
    if(cfg.mode==="HR")hr=rem;
    else if(cfg.mode==="Technical"){hr=2;tech=rem-2}
    else{hr=Math.max(2,Math.round(rem*0.3));tech=rem-hr}
    if(cfg.mode!=="HR"&&tech>=4&&CODE_DEPTS.includes(cfg.dept)){code=1;tech-=1}      /* one coding question inside the technical block */
  }
  else if(cfg.mode==="HR")hr=rem;
  else if(cfg.mode==="Technical")tech=rem;
  else{hr=Math.round(rem*0.3);tech=rem-hr}
  if(aptOnly&&apt<rem)note=t("poolNote").replace("{n}",fixed.length+apt);
  const mk=(c,k)=>Array.from({length:k},()=>({cat:c}));
  let all;
  if(mock){
    const hrs=mk("HR",hr);
    const closing=hrs.slice(-1).map(s=>Object.assign(s,{role:"close"}));
    const opening=hrs.slice(0,1).map(s=>Object.assign(s,{role:"open"})),midHr=hrs.slice(1,-1);
    const middle=shuffle(fixed.concat(midHr,mk("Technical",tech)));
    all=opening.concat(middle,mk("Coding",code),closing);
    /* hard guarantee of the order, whatever happened above: open (0) -> middle (1) -> close (2) */
    const rank=s=>s.role==="open"?0:s.role==="close"?2:1;
    all=all.map((s,i)=>[s,i]).sort((x,y)=>rank(x[0])-rank(y[0])||x[1]-y[1]).map(x=>x[0]);
    note=note||t("mockNote");
  }else{
    const gen=mk("HR",hr).concat(mk("Technical",tech),mk("Aptitude",apt));
    all=shuffle(fixed.concat(gen)).concat(mk("Coding",code));
  }
  return{slots:all,note};
}

/* ---------- run / question lifecycle ---------- */
async function startInterview(){
  if(S.starting)return;
  const f=S.form;
  if(!f.name.trim())return showFormErr(t("needName"));
  if(!f.stream||!f.course)return showFormErr(t("needCourse"));
  if(!f.dept)return showFormErr(t("needDept"));
  if(!f.ack)return showFormErr(t("needAck"));
  if(f.mode==="Coding"&&!CODE_DEPTS.includes(f.dept))return showFormErr(t("codeDeptOnly"));
  const resumeQs=S.resume.status==="review"?S.resume.qs.filter(q=>q.use&&q.text.trim()).map(q=>q.text.trim()):[];
  if(f.mode==="Resume-based"&&!resumeQs.length)return showFormErr(t("needResume"));
  if(!AI.ready)await AI.init();
  if(!AI.available()&&f.mode!=="Aptitude")return showFormErr(AI.offMsg());
  const custom=f.custom.split("\n").map(s=>s.trim().slice(0,300)).filter(Boolean).slice(0,5);
  const cfg={name:f.name.trim().slice(0,60),dept:f.dept,stream:f.stream,course:f.course,role:f.role.trim(),company:f.company.trim(),exp:f.exp,mode:f.mode,diff:f.diff,n:f.n,timer:f.timer,focus:{on:!!f.focusOn,limit:Math.max(1,Math.min(10,parseInt(f.focusLimit,10)||3))},follow:!!f.follow&&AI.available(),mock:f.mock&&f.mode!=="Coding"&&f.mode!=="Aptitude",pre:f.pre,lang:LANG,save:f.save,saveAns:f.save&&f.saveAns};
  let roleQs=[];
  if(f.mode==="Technical"||f.mode==="Mixed"){S.starting=true;const b=document.querySelector(".startbtn");if(b){b.disabled=true;b.textContent="⏳ "+t("prepRole")}
    try{roleQs=await genRoleQs(cfg)}catch(e){roleQs=[]}finally{S.starting=false}
    if(S.screen!=="home")return;}
  const plan=buildSlots(cfg,resumeQs,custom,roleQs);
  if(!plan.slots.length)return showFormErr("No questions available.");
  S.run={id:uid(),cfg,queue:plan.slots,total:plan.slots.length,asked:new Set(),level:cfg.diff==="Adaptive"?"Medium":cfg.diff,results:[],focus:{events:[],count:0,away:null,warn:null},startedAt:Date.now(),insights:{state:"idle",data:null,err:null},saved:false,postConf:"",note:plan.note};
  S.screen="interview";nextQuestion();
}
function starter(lang,q){
  const c=q.code;
  if(lang==="javascript")return`function ${c.fn}(${c.args}) {\n  // write your solution here\n}\n`;
  if(lang==="python")return`def ${snake(c.fn)}(${c.args}):\n    # write your solution here\n    pass\n`;
  if(lang==="java")return`class Solution {\n    // write the method for: ${c.title}\n}\n`;
  return`// write the function for: ${c.title}\n`;
}
function newCur(q,slot){
  const cur={key:uid(),q,slot,phase:"answer",draft:"",mcqPick:null,result:null,err:null,busy:false,timerStarted:false,rem:null,warned:false,mic:false,
    codeLang:"javascript",codes:{},tests:null,testBusy:false,followDraft:"",followBusy:false,followErr:null,trBusy:false};
  if(q.kind==="code"){["javascript","python","java","cpp"].forEach(l=>cur.codes[l]=starter(l,q))}
  return cur;
}
function nextQuestion(){
  const run=S.run;Timer.stop();Speech.stopSpeak();Speech.stopListen();
  let q=null,slot=null;
  while(run.queue.length&&!q){
    slot=run.queue.shift();
    q=slot.q||slot.fixed||pickFromBank(slot.cat,run.cfg.dept,run.level,run.asked,slot.role);
  }
  if(!q)return finishRun();
  run.asked.add(q.id);
  S.cur=newCur(q,slot);render();window.scrollTo(0,0);
}
function nextAfterFeedback(){
  const run=S.run;
  if(run.cfg.diff==="Adaptive")run.level=Scoring.nextLevel(run.level,run.results);
  const cur=S.cur;if(cur&&cur.result&&cur.result.follow&&cur.result.follow.state==="pending")cur.result.follow.state="skipped";
  nextQuestion();
}
function skipQuestion(){
  const run=S.run,cur=S.cur;if(!canSkip(run,cur))return;
  Timer.stop();Speech.stopListen();Speech.stopSpeak();
  const deferred={cat:cur.slot.cat,q:cur.q,deferred:true};
  const ci=run.cfg.mock?run.queue.findIndex(s=>s.role==="close"):-1;
  if(ci>=0)run.queue.splice(ci,0,deferred);      /* mock interview: a skipped question comes back BEFORE the HR closing */
  else run.queue.push(deferred);
  notify(t("skipNote"));nextQuestion();
}

/* ---------- timer glue ---------- */
function limitFor(cur,cfg){const T=TIMERS[cfg.timer];return T?(cur.q.kind==="code"?T.code:T.text):null}
function paintTimer(rem,limit){
  const num=$("#tmNum"),arc=$("#tmArc");if(!num||!arc||!limit)return;
  const c=rem<=10?"var(--bad)":rem<=limit/2?"var(--mid)":"var(--ok)";
  num.textContent=limit>=100?fmtTime(rem):rem;arc.style.strokeDashoffset=String(326.7*(1-rem/limit));arc.style.stroke=c;num.style.fill=c;
}
function startTimer(){
  const run=S.run,cur=S.cur;if(!run||!cur)return;
  const limit=limitFor(cur,run.cfg);cur.timerStarted=true;cur.limit=limit;if(!limit)return;
  const runId=run.id,key=cur.key;
  Timer.start(limit,(rem)=>{
    if(!S.run||S.run.id!==runId||!S.cur||S.cur.key!==key)return;
    S.cur.rem=rem;paintTimer(rem,limit);
    if(rem<=10&&rem>0&&!S.cur.warned){S.cur.warned=true;const w=$("#tmWarn");if(w)w.innerHTML=`<div class="warn warn10">${esc(t("tenSec"))}</div>`;const l=$("#live");if(l)l.textContent=t("tenSec")}
  },()=>{
    if(!S.run||S.run.id!==runId||!S.cur||S.cur.key!==key||S.cur.phase!=="answer")return;
    const l=$("#live");if(l)l.textContent=t("timeUp");
    submit(true);
  });
}
function afterInterviewRender(){
  const run=S.run,cur=S.cur;if(!run||!cur)return;
  const limit=limitFor(cur,run.cfg);
  if(cur.phase==="answer"&&limit){if(!cur.timerStarted)startTimer();else Timer.tickNow()}
  else if(limit)paintTimer(cur.rem==null?limit:cur.rem,limit);
  if(LANG==="ta")ensureTranslation();
  const a=$("#ans")||$("#codeArea");if(a&&cur.phase==="answer"&&!a.dataset.f0){a.dataset.f0="1"}
  if(cur.phase==="error"||cur.phase==="feedback"){const h=$("#phaseHead");if(h)h.focus({preventScroll:true})}
}

/* ---------- translation of questions (Tamil mode) ---------- */
function qDisplay(q){
  if(LANG!=="ta")return{main:q.text,orig:"",note:""};
  const v=S.tr[q.text];
  if(typeof v==="string")return{main:v,orig:q.text,note:""};
  if(v===null)return{main:q.text,orig:"",note:t("transFail")};
  return{main:q.text,orig:"",note:t("translating")};
}
async function ensureTranslation(){
  const cur=S.cur;if(!cur||LANG!=="ta")return;const q=cur.q;
  if(S.tr[q.text]!==undefined||cur.trBusy)return;
  if(!AI.available()){S.tr[q.text]=null;updateQuestionText();return}
  cur.trBusy=true;const key=cur.key;
  try{const raw=await AI.json(Prompts.translate(q.text),{modelTier:"quick",cache:true});const ta=Val.str(raw&&raw.ta,500);if(!ta)throw new Error("empty");S.tr[q.text]=ta}
  catch(e){S.tr[q.text]=null}
  cur.trBusy=false;if(S.cur&&S.cur.key===key)updateQuestionText();
}
function updateQuestionText(){
  const cur=S.cur;if(!cur)return;const d=qDisplay(cur.q);
  const a=$("#qText"),b=$("#qOrig"),c=$("#qNote");
  if(a){a.textContent=d.main;a.lang=LANG==="ta"&&d.orig?"ta":"en"}if(b)b.textContent=d.orig;if(c)c.textContent=d.note;
}

/* ---------- submitting & evaluating ---------- */
function isStarter(cur){return(cur.codes[cur.codeLang]||"").trim()===starter(cur.codeLang,cur.q).trim()}
function newResult(cur,run){
  const q=cur.q;
  return{qid:q.id,text:q.text,cat:q.cat,diff:q.diff,topic:q.topic,src:q.src,kind:q.kind==="mcq"?"mcq":q.kind==="code"?"code":"text",qobj:q,answer:"",status:"pending",main:null,ev:null,tests:null,follow:null,
    timedOut:false,mcq:q.mcq||null,codeLang:null,timeUsed:cur.limit&&cur.rem!=null?cur.limit-cur.rem:null};
}
async function submit(auto){
  const run=S.run,cur=S.cur;if(!run||!cur||cur.phase!=="answer"||cur.busy)return;
  const q=cur.q;let answer="";
  if(q.kind==="mcq")answer=cur.mcqPick!==null?String(cur.mcqPick):"";
  else if(q.kind==="code")answer=isStarter(cur)?"":(cur.codes[cur.codeLang]||"").trim();
  else answer=(cur.draft||"").trim();
  if(!answer&&!auto){notify(t("needAnswer"),"warn");return}
  cur.busy=true;Timer.stop();Speech.stopListen();Speech.stopSpeak();
  const r=newResult(cur,run);r.timedOut=!!auto;cur.result=r;run.results.push(r);
  if(!answer){r.status="unanswered";r.main=0;cur.phase="feedback";cur.busy=false;render();return}
  if(q.kind==="mcq"){
    r.answer=q.mcq.o[+answer];r.status="auto";r.main=(+answer===q.mcq.a)?10:0;cur.phase="feedback";cur.busy=false;render();return}
  r.answer=answer;if(q.kind==="code")r.codeLang=cur.codeLang;
  cur.busy=false;await evaluate(cur);
}
async function evaluate(cur){
  const run=S.run;if(!run||cur.busy)return;
  const r=cur.result,q=cur.q,tok=run.id,key=cur.key,cfg=run.cfg;
  cur.busy=true;cur.err=null;cur.phase="evaluating";render();
  const alive=()=>S.run&&S.run.id===tok&&S.cur&&S.cur.key===key;
  try{
    let ev;
    if(q.kind==="code"){
      let tests=null;
      if(cur.codeLang==="javascript"){
        tests=await Runner.run(q.code,r.answer);if(!alive())return;
        r.tests=tests.unavailable?{executed:false,unavailable:true,error:tests.error,rows:[],passed:0,total:0}:tests;
        cur.tests=r.tests;
      }
      const raw=await AI.json(Prompts.code(cfg,{text:q.text,prompt:q.code.p,fn:q.code.fn},LANG_NAME[cur.codeLang],r.answer,r.tests&&r.tests.executed?r.tests:null),{modelTier:"default"});
      if(!alive())return;ev=Val.codeEval(raw);
    }else{
      const raw=await AI.json(Prompts.text(cfg,q,r.answer,cfg.follow&&!r.timedOut),{modelTier:"default"});
      if(!alive())return;ev=Val.textEval(raw,q.cat==="HR");
    }
    r.ev=ev;r.main=ev.main;r.status="evaluated";
    if(cfg.follow&&ev.followUp&&r.kind==="text"&&!r.follow)r.follow={q:ev.followUp,a:"",score:null,comment:"",state:"pending"};
    cur.phase="feedback";
  }catch(e){
    if(!alive())return;
    r.status="unevaluated";cur.err=(e&&e.code)?AI.errMsg(e):("The AI reply was invalid or incomplete ("+((e&&e.message)||"error")+").");cur.phase="error";
  }
  cur.busy=false;render();
}
async function submitFollow(){
  const run=S.run,cur=S.cur;if(!run||!cur||!cur.result)return;const r=cur.result,f=r.follow;
  if(!f||f.state!=="pending"||cur.followBusy)return;
  const a=(cur.followDraft||"").trim();if(!a){notify(t("needAnswer"),"warn");return}
  cur.followBusy=true;cur.followErr=null;render();
  const tok=run.id,key=cur.key;
  try{
    const raw=await AI.json(Prompts.follow(run.cfg,cur.q,r.answer,f.q,a));
    if(!(S.run&&S.run.id===tok&&S.cur&&S.cur.key===key))return;
    const sc=Val.num(raw&&raw.score);if(sc===null)throw new Error("invalid score");
    if(f.state==="pending"){f.a=a;f.score=sc;f.comment=Val.str(raw.comment,300);f.state="done"}   /* applied exactly once */
  }catch(e){if(!(S.run&&S.run.id===tok&&S.cur&&S.cur.key===key))return;cur.followErr=(e&&e.code)?AI.errMsg(e):"The AI reply was invalid."}
  cur.followBusy=false;render();
}
async function runTestsNow(){
  const cur=S.cur;if(!cur||cur.phase!=="answer"||cur.testBusy||cur.codeLang!=="javascript")return;
  if(isStarter(cur)){notify(t("needAnswer"),"warn");return}
  cur.testBusy=true;const out=$("#testOut");if(out)out.innerHTML=`<div class="info"><span class="spin"></span>…</div>`;
  const key=cur.key;
  const res=await Runner.run(cur.q.code,cur.codes.javascript);
  cur.testBusy=false;if(!S.cur||S.cur.key!==key)return;
  cur.tests=res;const o=$("#testOut");if(o)o.innerHTML=testsHTML(res);
}

  <div id="focusWarn" aria-live="assertive">${FocusMon.warnHTML(run)}</div>
  <div class="layout"><div><div class="card"><span class="badge">${kindBadge}</span><span class="badge ${esc(q.diff)}">${esc(t(q.diff))}</span><span class="badge">${esc(srcLabel(q))}</span>
  <div class="q" id="qText" lang="${LANG==="ta"&&d.orig?"ta":"en"}">${esc(d.main)}</div><div class="qorig" id="qOrig">${esc(d.orig)}</div><div class="muted small" id="qNote">${esc(d.note)}</div>
  ${body}</div></div>
  <div class="side">${timerCard(cur,cfg)}${FocusMon.card(run)}<div class="card pc"><div class="lab" style="margin-top:0">${esc(t("progress"))}</div><div class="qnum"><b>${String(pos).padStart(2,"0")}</b><span> / ${String(run.total).padStart(2,"0")}</span></div>
  <div class="bar" role="progressbar" aria-label="${esc(t("progress"))}" aria-valuemin="0" aria-valuemax="${run.total}" aria-valuenow="${done}"><i style="width:${pct}%;background:linear-gradient(90deg,var(--ac2),var(--ac))"></i></div><div class="small muted">${pct}%</div></div><div class="card"><div class="lab" style="margin-top:0">💡 ${esc(t("tips"))}</div><p class="small" style="margin:0">${esc(tipsFor(q))}</p></div>
  <button class="btn alt sm" data-act="exit">✖ ${esc(t("exit"))}</button></div></div></div>`;
}

/* ===================== UI PART 3: final dashboard, history, events ===================== */
function historyItem(run,st){
  const c=run.cfg;
  return{v:1,rv:RUBRIC_VERSION,id:run.id,ts:run.startedAt,dept:c.dept,course:c.course,stream:c.stream,mode:c.mode,diff:c.diff,lang:c.lang,role:c.role.slice(0,80),overall:st.overall,comp:st.completion,n:st.total,retry:!!run.retryOf,dims:st.dims,fo:(run.focus&&run.cfg.focus&&run.cfg.focus.on)?{n:run.focus.count,l:run.cfg.focus.limit,ev:run.focus.events.slice(0,30).map(e=>({ty:e.ty,at:e.at,ms:e.ms}))}:null,
    qs:run.results.map(r=>{const o={t:r.text.slice(0,160),c:r.cat,d:r.diff,tp:r.topic,s:Scoring.qScore(r),st:r.status};if(c.saveAns){o.a=(r.answer||"").slice(0,1500);o.f=r.ev?r.ev.verdict:""}return o})};
}
function finishRun(){
  Timer.stop();Speech.stopSpeak();Speech.stopListen();
  const run=S.run;S.cur=null;S.screen="final";
  const st=Scoring.stats(run.results,run.total);run.st=st;
  run.saveMsg="";
  if(run.cfg.save&&!run.saved){
    run.saved=true;
    const items=[historyItem(run,st)].concat(S.hist.items.filter(x=>x.id!==run.id));
    const res=Store.saveHistory(items);
    S.hist.items=items.slice(0,Store.MAX);S.hist.unavailable=res.reason==="unavailable";
    if(!res.ok){S.storeMsg=res.reason==="unavailable"?t("storeOff"):t("storeFail");run.saveMsg=S.storeMsg}
    else{S.storeMsg="";if(res.kept<items.length)S.hist.items=items.slice(0,res.kept);run.saveMsg=t("saveOk")}
  }else if(!run.cfg.save)run.saveMsg=t("saveSkipped");
  render();window.scrollTo(0,0);
  if(AI.available()&&st.aiN>0)genInsights();
}
async function genInsights(){
  const run=S.run;if(!run||run.insights.state==="loading")return;
  run.insights={state:"loading",data:null,err:null};paintInsights();
  const tok=run.id;
  try{
    const weak=Scoring.weakTopics(run.results);
    const raw=await AI.json(Prompts.insights(run.cfg,run.st,run.results,weak),{modelTier:"default"});
    if(!S.run||S.run.id!==tok)return;
    if(!raw||typeof raw!=="object")throw new Error("invalid");
    const plan=(Array.isArray(raw.plan)?raw.plan:[]).filter(p=>p&&typeof p==="object").map((p,i)=>({day:i+1,focus:Val.str(p.focus,120),tasks:Val.str(p.tasks,400)})).filter(p=>p.focus||p.tasks);
    if(plan.length<7)throw new Error("the 7-day plan was incomplete");
    run.insights={state:"done",err:null,data:{summary:Val.str(raw.summary,900),strengths:Val.list(raw.strengths,5),improvements:Val.list(raw.improvements,5),topics:Val.list(raw.topics,8,120),plan:plan.slice(0,7)}};
  }catch(e){if(!S.run||S.run.id!==tok)return;run.insights={state:"error",data:null,err:(e&&e.code)?AI.errMsg(e):("Invalid AI reply: "+((e&&e.message)||"error"))}}
  paintInsights();
}
function insightsHTML(run){
  const I=run.insights;
  if(!AI.available())return`<div class="warn">${esc(t("noAI"))}: ${esc(AI.offMsg())}</div>`;
  if(run.st.aiN===0)return`<div class="info">${esc(t("insightsWhy"))}</div>`;
  if(I.state==="loading")return`<div class="info" role="status"><span class="spin"></span>${esc(t("evaluating"))}</div>`;
  if(I.state==="error")return`<div class="err" role="alert"><b>${esc(t("insightsFail"))}</b><br>${esc(I.err)}</div><button class="btn sm" data-act="insights">🔁 ${esc(t("retry"))}</button>`;
  if(I.state==="done"){const d=I.data;
    return`<span class="badge">AI</span><p>${esc(d.summary)}</p><div class="cols"><div><h3 style="margin-top:0">${esc(t("strengths"))}</h3>${li(d.strengths)}</div><div><h3 style="margin-top:0">${esc(t("weakAreas"))}</h3>${li(d.improvements)}</div></div>
    <h3>${esc(t("topics"))}</h3>${chips(d.topics)}<h3>${esc(t("plan"))}</h3><div class="tw"><table class="t">${d.plan.map(p=>`<tr><th>${esc(t("day"))} ${p.day}</th><td><b>${esc(p.focus)}</b><br>${esc(p.tasks)}</td></tr>`).join("")}</table></div>`}
  return`<button class="btn sm" data-act="insights">✨ ${esc(t("genInsights"))}</button>`;
}
function paintInsights(){const b=$("#insightsBox");if(b&&S.run)b.innerHTML=insightsHTML(S.run)}

function viewFinal(){
  const run=S.run,st=run.st,cfg=run.cfg;
  const weakQ=run.results.filter(r=>{const s=Scoring.qScore(r);return s!==null&&s<6});
  const wt=Scoring.weakTopics(run.results);
  const strong=[];Object.keys(st.dims).forEach(k=>{if(st.dims[k]>=7)strong.push(`${t(k)}: ${st.dims[k]}/10`)});
  wt.filter(x=>x.score>=7).slice(-3).forEach(x=>strong.push(`${x.topic}: ${x.score}/10`));
  const weak=[];Object.keys(st.dims).forEach(k=>{if(st.dims[k]<6)weak.push(`${t(k)}: ${st.dims[k]}/10`)});
  wt.filter(x=>x.score<6).slice(0,4).forEach(x=>weak.push(`${x.topic}: ${x.score}/10`));
  const label=st.overall==null?"":st.overall>=8?"🌟":st.overall>=6.5?"👍":st.overall>=5?"📈":"💪";
  let h=`<div class="hero" style="padding-bottom:34px"><span class="pill">🏆 ${esc(t("final"))}</span><h1>${esc(cfg.name)}</h1><p>${esc([cfg.course,cfg.dept!==cfg.course?cfg.dept:"",cfg.role].filter(Boolean).join(" · "))} · ${esc(cfg.mode)} · ${esc(cfg.diff==="Adaptive"?t("Adaptive"):t(cfg.diff))}${run.retryOf?" · "+esc(t("retryCmp")):""}</p></div><div class="wrap" style="margin-top:-18px">`;
  h+=`<div class="card" style="text-align:center"><div style="display:flex;justify-content:center">${ring(st.overall,190,t("overall"))}</div><h2 style="margin-top:6px">${esc(t("overall"))} ${label}</h2>
  ${st.overall==null?`<p class="muted">${esc(t("notEval"))}</p>`:""}${run.saveMsg?`<p class="muted small">${esc(run.saveMsg)}</p>`:""}
  <details style="text-align:left"><summary>${esc(t("policy"))}</summary><p class="small">${esc(t("policyTxt"))}</p></details></div>`;
  h+=FocusMon.summaryHTML(run);
  if(st.unevalN>0)h+=`<div class="warn" role="alert">⚠ ${esc(t("unevalWarn").replace("{n}",st.unevalN))}</div>`;
  h+=`<div class="grid4"><div class="stat"><small>${esc(t("total"))}</small><b>${st.total}</b></div><div class="stat"><small>${esc(t("completion"))}</small><b>${st.completion}%</b></div><div class="stat"><small>${esc(t("scoredQ"))}</small><b>${st.scoredN}</b></div><div class="stat"><small>${esc(t("aiN"))}</small><b>${st.aiN}</b></div>
  <div class="stat"><small>${esc(t("autoN"))}</small><b>${st.autoN}</b></div><div class="stat"><small>${esc(t("unansweredN"))}</small><b>${st.unansweredN}</b></div><div class="stat"><small>${esc(t("timedOut"))}</small><b>${st.timedOutN}</b></div><div class="stat"><small>${esc(t("notEval"))}</small><b>${st.unevalN}</b></div></div>`;
  if(run.retryOf){
    const rows=run.results.map(r=>{const prev=run.retryOf.scores[r.qid],now=Scoring.qScore(r);const d=prev!=null&&now!=null?r1(now-prev):null;
      return`<tr><td>${esc(r.text)}</td><td>${prev==null?"–":prev}</td><td>${now==null?"–":now}</td><td style="color:${d==null?"inherit":d>=0?"var(--ok)":"var(--bad)"}">${d==null?"–":(d>0?"+":"")+d}</td></tr>`}).join("");
    h+=`<div class="card"><h2>${esc(t("retryCmp"))}</h2><p class="muted small">${esc(t("cmpNote"))}</p><div class="tw"><table class="t"><tr><th></th><th>${esc(t("prev"))}</th><th>${esc(t("curr"))}</th><th>${esc(t("chg"))}</th></tr>${rows}</table></div></div>`;
  }
  h+=`<div class="cols"><div class="card"><h3 style="margin-top:0">${esc(t("skillsH"))}</h3>${Object.keys(st.dims).length?Object.keys(st.dims).map(k=>bar(t(k),st.dims[k])).join(""):`<p class="muted small">–</p>`}</div>
  <div class="card"><h3 style="margin-top:0">${esc(t("catH"))}</h3>${Object.keys(st.byCat).map(k=>bar(k,st.byCat[k])).join("")||"–"}<h3>${esc(t("diffH"))}</h3>${LEVELS.filter(l=>st.byDiff[l]!=null).map(l=>bar(t(l),st.byDiff[l])).join("")||"–"}</div></div>`;
  {const cl=run.results.filter(r=>r.ev&&r.ev.confidence&&r.ev.confidence.level);if(cl.length){const cnt={low:0,moderate:0,high:0};cl.forEach(r=>cnt[r.ev.confidence.level]++);const sug=[...new Set(run.results.flatMap(r=>r.ev&&r.ev.confidence?r.ev.confidence.suggestions:[]))].slice(0,4),ct=[...new Set(run.results.flatMap(r=>r.ev&&r.ev.commTips?r.ev.commTips:[]))].slice(0,3);
    h+=`<div class="card"><h3 style="margin-top:0">🎤 ${esc(t("finalConfH"))}</h3><p class="muted small">${esc(t("confRated"))}: ${cl.length}</p><div class="grid4"><div class="stat"><small>${esc(t("conf_high"))}</small><b>${cnt.high}</b></div><div class="stat"><small>${esc(t("conf_moderate"))}</small><b>${cnt.moderate}</b></div><div class="stat"><small>${esc(t("conf_low"))}</small><b>${cnt.low}</b></div></div>${sug.length?`<h3>${esc(t("confSug"))}</h3>${li(sug)}`:""}${ct.length?`<h3>${esc(t("commTips"))}</h3>${li(ct)}`:""}<p class="muted small">${esc(t("confNote"))}</p></div>`}}
  h+=`<div class="cols"><div class="card"><h3 style="margin-top:0">💪 ${esc(t("strengths"))} <span class="muted small">(${esc(t("strengthsDet"))})</span></h3>${li(strong)||`<p class="muted small">–</p>`}</div>
  <div class="card"><h3 style="margin-top:0">🛠 ${esc(t("weakAreas"))}</h3>${li(weak)||`<p class="muted small">–</p>`}</div></div>`;
  h+=`<div class="card"><h3 style="margin-top:0">${esc(t("perQ"))}</h3>`+run.results.map((r,i)=>{
    const s=Scoring.qScore(r);const tag=r.status==="auto"?t("autoGraded"):r.status==="evaluated"?t("aiEval"):r.status==="unanswered"?t("unansweredN"):t("notEval");
    return`<details><summary>Q${i+1}. ${esc(r.text)} — <b>${s==null?"–":s+"/10"}</b> <span class="badge ${s==null?"":scoreCls(s)}">${esc(tag)}</span></summary>
    <p class="small muted">${esc(r.cat)} · ${esc(r.diff)} · ${esc(r.topic)}${r.timedOut?" · "+esc(t("timedOut")):""}</p><div class="item">${esc(r.answer||"–")}</div>
    ${r.ev?`<p>${esc(r.ev.verdict)}</p>${li(r.ev.improvements.slice(0,3))}`:""}${r.tests&&r.tests.executed?`<p class="small"><b>${esc(t("testsH"))}:</b> ${r.tests.passed}/${r.tests.total}</p>`:""}</details>`}).join("")+`</div>`;
  h+=`<div class="card"><h3 style="margin-top:0">${esc(t("selfH"))}</h3><p class="small">${esc(t("before"))}: <b>${cfg.pre||"–"}</b></p>
  <label class="lab" for="postConf">${esc(t("preAfter"))}</label><select id="postConf" data-q="postConf" style="max-width:160px"><option value="">–</option>${[1,2,3,4,5].map(n=>`<option ${String(run.postConf)===String(n)?"selected":""}>${n}</option>`).join("")}</select></div>`;
  h+=`<div class="card"><h2>${esc(t("insightsH"))}</h2><div id="insightsBox">${insightsHTML(run)}</div></div>`;
  h+=`<div class="card"><label style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><input type="checkbox" data-q="inclName" ${run.inclName===false?"":"checked"}> <span>${esc(t("name"))}</span></label>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn sm" data-act="dlHtml">⬇ ${esc(t("dlHtml"))}</button><button class="btn alt sm" data-act="dlCsv">⬇ ${esc(t("dlCsv"))}</button></div>
  <p class="muted small">${esc(t("dlNote"))}</p><p class="muted small">${esc(t("disclaimer"))}</p></div>`;
  h+=`<div class="card"><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="newInt">▶ ${esc(t("newInt"))}</button>
  <button class="btn alt" data-act="retryWeak" ${weakQ.length?"":"disabled"}>🔁 ${esc(t("retryWeak"))} (${weakQ.length})</button><button class="btn alt" data-act="clearRun">🧹 ${esc(t("clearData"))}</button></div>
  ${weakQ.length?"":`<p class="muted small">${esc(t("retryNone"))}</p>`}</div></div>`;
  return h;
}

/* ---------- actions ---------- */
function goHome(){Timer.stop();Speech.stopSpeak();Speech.stopListen();S.run=null;S.cur=null;S.screen="home";render();window.scrollTo(0,0)}
function retryWeak(){
  const old=S.run;if(!old)return;
  const weak=old.results.filter(r=>{const s=Scoring.qScore(r);return s!==null&&s<6});
  if(!weak.length){notify(t("retryNone"));return}
  const scores={};weak.forEach(r=>scores[r.qid]=Scoring.qScore(r));
  const cfg=Object.assign({},old.cfg);
  S.run={id:uid(),cfg,queue:weak.map(r=>({cat:r.cat,fixed:r.qobj})),total:weak.length,asked:new Set(),level:old.level,results:[],focus:{events:[],count:0,away:null,warn:null},startedAt:Date.now(),insights:{state:"idle",data:null,err:null},saved:false,postConf:"",note:"",retryOf:{id:old.id,scores}};
  S.screen="interview";nextQuestion();
}
async function download(kind){
  const run=S.run;if(!run||!run.st)return;
  const nm=run.inclName===false?"":run.cfg.name;
  const stamp=new Date().toISOString().slice(0,10);
  const res=kind==="csv"?await Exp.save(`interview-scores-${stamp}.csv`,Exp.csv(run,run.st)):await Exp.save(`interview-report-${stamp}.html`,Exp.html(run,run.st,nm));
  if(!res.ok)notify(res.msg||t("dlFail"),"warn");
}
const ACT={
  focusOk(){FocusMon.dismiss()},
  async aiRetry(){AI.ready=false;render();await AI.init();render()},
  async aiTest(){const b=$("#aiTestBtn"),m=$("#aiTestMsg");if(b)b.disabled=true;if(m)m.textContent=t("aiTesting");
    try{await AI.test();if(m)m.textContent="✅ "+t("aiTestOk");render()}catch(e){if(b)b.disabled=false;const mm=$("#aiTestMsg");if(mm)mm.textContent="⚠️ "+AI.errMsg(e)}},
  stream(b){const f=S.form,v=b.dataset.s;if(f.stream!==v){f.stream=v;f.course="";f.dept="";f.roleSel="";f.role="";if(f.mode==="Coding")f.mode="Mixed"}render()},
  course(b){const f=S.form;f.course=b.dataset.c;if(f.stream==="Arts & Science"){f.dept=f.course;if(f.mode==="Coding"&&!CODE_DEPTS.includes(f.dept))f.mode="Mixed"}render()},
  dept(b){S.form.dept=b.dataset.d;if(S.form.mode==="Coding"&&!CODE_DEPTS.includes(S.form.dept))S.form.mode="Mixed";render()},
  start(){startInterview()},
  extract(){extractResume()},
  async delOne(b){if(await confirmDialog(t("confirmDel"),t("del"))){const items=S.hist.items.filter(i=>i.id!==b.dataset.id);const r=Store.saveHistory(items);S.hist.items=items;if(!r.ok&&items.length===0)Store.clearHistory();render()}},
  async delAll(){if(await confirmDialog(t("confirmDelAll"),t("delAll"))){Store.clearHistory();S.hist.items=[];S.hist.corrupted=false;S.storeMsg="";render()}},
  clearCorrupt(){Store.clearHistory();S.hist={items:[],corrupted:false,unavailable:false};render()},
  submit(){submit(false)},skip(){skipQuestion()},next(){nextAfterFeedback()},retryEval(){const c=S.cur;if(c&&c.phase==="error"){c.result.status="pending";evaluate(c)}},
  runTests(){runTestsNow()},followSubmit(){submitFollow()},followSkip(){const c=S.cur;if(c&&c.result&&c.result.follow){c.result.follow.state="skipped";render()}},
  async exit(){if(await confirmDialog(t("confirmExit"),t("exit")))goHome()},
  speakQ(){const c=S.cur;if(!c)return;const d=qDisplay(c.q);let lang=LANG,text=d.main;
    if(LANG==="ta"&&!d.orig){lang="en";notify(t("spokenEnglishFallback"));}
    const r=Speech.speak(text,lang);if(!r.ok)notify(r.msg,"warn")},
  mic(){const c=S.cur;if(!c||c.phase!=="answer")return;
    if(c.mic){Speech.stopListen();c.mic=false;render();return}
    if(!Speech.canListen()){notify(t("noMic"),"warn");return}
    FocusMon.pause(6000);const sl=S.sl||LANG;c.mic=true;render();
    const inter=v=>{const e=$("#interim");if(e)e.textContent=v?"… "+v:""};
    const r=Speech.listen(sl,txt=>{if(S.cur===c){c.draft=((c.draft?c.draft+" ":"")+txt).trim();const a=$("#ans");if(a)a.value=c.draft;inter("")}},
      ()=>{if(S.cur===c){c.mic=false;const b=$("#micBtn");if(b)b.textContent="🎤 "+t("speak");inter("")}},
      m=>{if(S.cur===c){c.mic=false;notify(m,"warn");render()}},inter);
    if(r)notify(t("micLive"))},
  insights(){genInsights()},dlHtml(){download("html")},dlCsv(){download("csv")},
  newInt(){goHome()},retryWeak(){retryWeak()},
  clearRun(){S.run=null;S.cur=null;S.resume={status:"none",text:"",fileName:"",err:"",qs:[],info:null,busy:false};S.tr={};S.screen="home";render();notify(t("cleared"));window.scrollTo(0,0)}
};
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.tagName==="INPUT"||b.tagName==="SELECT")return;
  const f=ACT[b.dataset.act];if(f)f(b,e);
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.act==="file"){onFile(el);return}
  if(el.dataset&&el.dataset.q){onQInput(el);return}
  if(el.dataset&&el.dataset.f){const re=formField(el);if(re)render()}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.q&&el.tagName!=="SELECT"&&el.type!=="radio"&&el.type!=="checkbox"){onQInput(el);return}
  if(el.dataset&&el.dataset.f&&(el.type==="text"||el.tagName==="TEXTAREA"))formField(el);
});
function onQInput(el){
  const k=el.dataset.q,cur=S.cur,run=S.run;
  if(k==="postConf"&&run){run.postConf=el.value;return}
  if(k==="inclName"&&run){run.inclName=el.checked;return}
  if(!cur)return;
  if(k==="draft")cur.draft=el.value;
  else if(k==="follow")cur.followDraft=el.value;
  else if(k==="mcq")cur.mcqPick=+el.value;
  else if(k==="sl")S.sl=el.value;
  else if(k==="code")cur.codes[cur.codeLang]=el.value;
  else if(k==="codeLang"){cur.codeLang=el.value;cur.tests=null;render()}
}
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==="Enter"&&S.screen==="interview"&&S.cur&&S.cur.phase==="answer"){e.preventDefault();submit(false)}
});
window.addEventListener("beforeunload",e=>{if(S.screen==="interview"&&S.run){e.preventDefault();e.returnValue=""}});
document.addEventListener("DOMContentLoaded",()=>{
  $("#langBtn").addEventListener("click",()=>{LANG=LANG==="ta"?"en":"ta";S.sl=null;S.prefs.lang=LANG;Store.savePrefs(S.prefs);render()});
  $("#themeBtn").addEventListener("click",()=>{
    const cur=document.documentElement.getAttribute("data-theme");
    const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
    const nx=dark?"light":"dark";document.documentElement.setAttribute("data-theme",nx);S.prefs.theme=nx;Store.savePrefs(S.prefs);
  });
  boot();
});
